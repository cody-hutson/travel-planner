name: Command taxonomy

# Runs scripts/test-command-taxonomy.sh on every push and every pull request, so the
# agreement between the command set and CLAUDE.md's Step-1 table is machine-graded rather
# than trusted. Added by #272, which implements ADR-007 Decision 3 (taxonomy ownership).
#
# SECURITY: no GitHub expression interpolation appears anywhere in this file, and in
# particular in no run: step — every value below is a repo-static literal. The property is
# stated without writing the token itself, so it stays mechanically checkable: a scan for
# the interpolation syntax over this file must return exactly zero. There is no path for
# attacker-controlled event data (issue titles, PR bodies, commit messages, head_ref) to
# reach a shell. This preserves the property publish-guard.yml states for itself.
#
# ── WHY A SEPARATE WORKFLOW RATHER THAN A STEP IN "Publish guard" ────────────────
# Three concrete reasons, not a preference:
#
#   1. SHARED FATE. test-publish-guard.sh sources publish-trip-site.sh. A taxonomy suite
#      added to that job would inherit a failure mode with nothing to do with taxonomy.
#   2. FAILURE ATTRIBUTION. This suite goes red when a contributor edits a docs table or
#      adds a command file. Routing that contributor to a check named "Publish guard
#      suite", whose header states it proves the publish-path guards are machine-graded,
#      is a legibility trap.
#   3. INHERITED ENV. publish-guard.yml declares GUARD_EXPECTED_SKIPS: 'D J1' — the two
#      declared exclusions of THAT suite. A step added to that job would inherit them.
#      This suite declares NO expected skips, so it needs its own env block, below.
#
# ── COVERAGE BOUNDARY ────────────────────────────────────────────────────────────
# What a green check here does and does not prove.
#
# IN SCOPE — these groups run on every invocation and their verdicts are real:
#   A     both populations non-empty — the Step-1 slice and .claude/commands/. This group
#         FAILS on an empty population; it never skips. CI checks out fresh, so a
#         .gitignore edit that un-ships the command surface goes red here rather than
#         passing vacuously over an empty set
#   B     Step-1 cell well-formedness, the closed 5-value reason enum, the kebab
#         code-span shape, and exhaustiveness (no silent gaps)
#   C     FORWARD — every ADDRESSED row resolves to a command file
#   D     REVERSE + INJECTIVITY — every command file has an ADDRESSED row, and no name
#         appears twice. C and D together are what make this a BIJECTION rather than two
#         one-way containment checks
#   E     ADR-007 section 4 completeness over all 10 publish invocation forms, the main()
#         dispatch-arm staleness sentinel, and cross-surface consistency between that
#         table and Step-1
#   F     no command file invokes an EXCLUDED publish form, and every mention of the
#         publish script is CLASSIFIED — an unresolvable mention fails rather than
#         silently resolving to nothing
#   G     the control case: each assertion above is exercised against a synthetic fixture
#         carrying exactly one deliberate defect, plus a MUST-NOT-FIRE arm proving the
#         guard is not hard-wired red. The fixtures are built in a temp dir and the repo
#         is never mutated, so the control re-proves itself on every push instead of
#         decaying into a one-time demonstration
#
# OUT OF SCOPE — deliberately, and by name:
#   RUNTIME PRIVILEGE. `allowed-tools` / `disallowed-tools` are a pre-approval grant,
#   turn-scoped — every tool stays callable, unlisted tools go through normal permission
#   settings, and the grant clears at the next message. This suite asserts that the
#   command files DECLARE what ADR-007 requires. A green here is NOT a privilege
#   guarantee, and must not be read as one.
#
# So a green check means: the command set and the Step-1 table are in bijection, every
# publish invocation form is dispositioned, no command reaches an excluded form, and the
# guard demonstrated on this very commit that it is still capable of failing.
#
# ── WHY THE STRICT MODE ──────────────────────────────────────────────────────────
# GUARD_STRICT_SKIPS=1 makes a skipped group a failure unless it is declared. This suite
# declares NO expected skips, so GUARD_EXPECTED_SKIPS is deliberately EMPTY: it has no
# dependency-gated group — no Node, no gh, no network — so there is no legitimate skip,
# and every skip fails the job. An empty declaration here is the correct value, not an
# omission.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  command-taxonomy:
    name: Command taxonomy suite (test-command-taxonomy.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No Node setup step: this suite is pure bash and POSIX text processing. It needs no
      # Node, no gh and no network, which is exactly why its expected-skip set is empty.
      - name: Run the command-taxonomy suite
        env:
          # A SKIP is a FAILURE unless its group is declared below.
          GUARD_STRICT_SKIPS: '1'
          # Empty by design — this suite has no dependency-gated group to declare.
          GUARD_EXPECTED_SKIPS: ''
        run: ./scripts/test-command-taxonomy.sh
