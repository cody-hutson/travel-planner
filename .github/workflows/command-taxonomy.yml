name: Command taxonomy

# Runs scripts/test-command-taxonomy.sh on every push and every pull request, so the
# agreement between the command surface and the CLAUDE.md taxonomy is machine-graded
# rather than trusted. Implements ADR-007 Decision 3 (taxonomy ownership) under a VERB
# surface, where the retired command-name-to-command-file bijection no longer has a
# right-hand side to point at.
#
# SECURITY: no GitHub expression interpolation appears anywhere in this file, and in
# particular in no run: step — every value below is a repo-static literal. The property is
# stated without writing the token itself, so it stays mechanically checkable: a scan for
# the interpolation syntax over this file must return exactly zero. There is no path for
# attacker-controlled event data (issue titles, PR bodies, commit messages, head refs) to
# reach a shell.
#
# ── WHY A SEPARATE WORKFLOW RATHER THAN A STEP IN AN EXISTING JOB ────────────────
# The same three concrete reasons the sibling contract workflow already records:
#
#   1. SHARED FATE. test-publish-guard.sh sources publish-trip-site.sh. A taxonomy suite
#      added to that job would inherit a failure mode with nothing to do with taxonomy.
#   2. FAILURE ATTRIBUTION. This suite goes red when a contributor edits a docs table or
#      a command file's verb sections. Routing that contributor to a check named
#      "Publish guard suite", whose header states it proves the publish-path guards are
#      machine-graded, is a legibility trap.
#   3. INHERITED ENV. publish-guard.yml declares its own expected-skip set — the declared
#      exclusions of THAT suite. A step added to that job would inherit them. This suite
#      declares NO expected skips, so it needs its own env block, below.
#
# ── COVERAGE BOUNDARY ────────────────────────────────────────────────────────────
# What a green check here does and does not prove. THE GROUP AND ARM INVENTORY IS NOT
# RESTATED HERE, deliberately: it lives in exactly one place — the banner of the guard
# script, which is also where the invariant binding it is stated, and which the script's
# own group Y then checks against the code. A count copied into this file would be a copy
# with no assertion behind it, and that is the failure mode this suite exists to catch.
#
# IN SCOPE — the DECLARATION surface. Every group runs on every invocation, needs no
# network, no Node and no gh, and its verdict is real. In summary, a green means: every
# declared verb of every command file resolves to exactly one implementing region; every
# ADDRESSED taxonomy cell covers a non-empty set of those verbs; every coverage unit of
# the surface is covered by exactly one cell; the charter's two enumerations of the verb
# set agree as a set difference in both directions; the publish-form disposition table is
# complete, sentinel-current and cross-linked to the live surface with no command map
# held anywhere; no command file reaches an excluded publish form; and the guard
# demonstrated ON THIS COMMIT that it is still capable of failing — including the
# mutation pair, which shows the verb population is DERIVED and not remembered.
#
# OUT OF SCOPE — deliberately, and by name:
#   RUNTIME PRIVILEGE. This suite asserts that the command files DECLARE what ADR-007
#   requires. It does not assert that a declaration is enforced at runtime, and a green
#   here is NOT a privilege guarantee. On what a `disallowed-tools` line does, this
#   repository carries two incompatible accounts with nothing arbitrating between them,
#   and nothing in this repository reads such a line. The guard takes neither account:
#   every assertion it makes holds under either.
#
#   PROSE-RENDERED INVOCATIONS. The invocation limb reaches the FENCED rendering only.
#   Where a command file renders an invocation as prose across a hard wrap, with a
#   forbidden flag named inside a negating sentence in the same paragraph, no literal
#   scan separates use from mention. That is a declared uncovered region, not an
#   omission, and the guard prints the count of invocations it attributed.
#
#   PER-VERB ARM BINDING. That one verb's region does not invoke another verb's granted
#   arm is a rule a file follows, not a property the guard can derive.
#
# ── WHY THE STRICT MODE ──────────────────────────────────────────────────────────
# GUARD_STRICT_SKIPS=1 makes a skipped group a failure unless it is declared. This suite
# declares NO expected skips, so GUARD_EXPECTED_SKIPS is deliberately EMPTY: it has no
# dependency-gated group — no Node, no gh, no network — so there is no legitimate skip,
# and every skip fails the job. An empty declaration here is the correct value, not an
# omission. The guard closes a second door the strict mode does not watch: a POPULATION
# vanishing. A checkout that un-ships the command surface, or a charter edit that empties
# the taxonomy slice, goes RED rather than passing vacuously over an empty set.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  command-taxonomy:
    name: Command taxonomy suite (test-command-taxonomy.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No Node setup step: this suite is pure bash and POSIX text processing. It needs
      # no Node, no gh and no network, which is exactly why its expected-skip set is
      # empty.
      - name: Run the command-taxonomy suite
        env:
          # A SKIP is a FAILURE unless its group is declared below.
          GUARD_STRICT_SKIPS: '1'
          # Empty by design — this suite has no dependency-gated group to declare.
          GUARD_EXPECTED_SKIPS: ''
        run: ./scripts/test-command-taxonomy.sh
