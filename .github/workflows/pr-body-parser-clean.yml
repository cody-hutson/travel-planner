name: PR body parser-clean

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  # gate-efficacy: posture=advisory
  #   Advisory by decision, and deliberately absent from the required contexts.
  #   Its subject is the pull-request BODY rather than the tree: it reads
  #   `github.event.pull_request.body`, triggers on `pull_request` only, and honours
  #   an in-body override marker the author controls — so it has no verdict at all on
  #   a direct push to `main`. Recorded here so the omission reads as a decision.
  parser-clean:
    name: Close-keyword leak detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for working directory)
        uses: actions/checkout@v7

      - name: Scan PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # scan — grep as a pipeline stage that either RAN or stops the step. grep exits 0 on
          # a match and 1 on none; both mean it read its input, and any other status means it
          # did not. Under pipefail this stage's 1 becomes the capture's status, and each capture
          # below stops the step on it instead of reading it as a clean body. `|| true` read all
          # three alike, so a genuine error became an empty anchor (the whole body scanned) or an
          # empty match list (a green check). The same rule as depersonalization.yml's grep_stage.
          scan() { grep "$@" || [ "$?" -eq 1 ]; }

          # Handle null/empty body
          if [ -z "${PR_BODY:-}" ]; then
            echo "PR body is empty — nothing to scan" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 1. Override-marker detection (whole-body, requires HTML-comment wrapper)
          #
          # `grep -c` + a count test, NOT `grep -q`: `-q` exits on the FIRST match and
          # closes the pipe, so on a large body the producing `printf` takes EPIPE and
          # `pipefail` carries the writer's failure out as the pipeline's status. That
          # status is 141 ONLY where SIGPIPE is fatal; a GitHub-hosted runner hands the
          # step SIGPIPE already ignored, so the writer returns 1 with a broken-pipe
          # write error on stderr instead. Either way the `if` reads FALSE even though
          # the marker was found, silently ignoring a present override. NEITHER THE
          # EXIT CODE NOR THE SUMMARY NOR THE CHECK'S COLOUR DIAGNOSES THAT: the exit
          # code can be 0, the summary block is present, and the check can be GREEN.
          # On a GitHub-hosted runner one trace does: a run that discarded the
          # override carries that broken-pipe error on stderr, naming THIS
          # statement's line, and no other run does. Where SIGPIPE is fatal there is
          # no trace at all, and only the differential — was a marker-carrying body's
          # override honoured? — separates it. Same root cause as step 4 below; `-c`
          # reads to EOF.
          OVERRIDE_HITS=$(printf '%s\n' "$PR_BODY" \
            | scan -cE '<!--[[:space:]]*pr-body-parser-clean:[[:space:]]*allow-close-keyword[[:space:]]*-->') \
            || { echo "::error::the override-marker scan did not run (grep failed) — nothing was scanned"; exit 1; }
          if [ "${OVERRIDE_HITS:-0}" -gt 0 ]; then
            {
              echo "## Override active"
              echo ""
              echo 'Marker `<!-- pr-body-parser-clean: allow-close-keyword -->` present in PR body.'
              echo "Reporting matches for visibility but NOT failing the check."
              echo ""
              echo "### Matches detected (override-suppressed):"
              echo '```'
              printf '%s\n' "$PR_BODY" | grep -inE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) +#?\[?[0-9]' || echo "(none)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 2. Locate Issue References anchor (case-insensitive, H1-H6, lenient on trailing colon/whitespace).
          #    `awk 'NR == 1'`, NOT `head -1`: awk reads to EOF, so the writer is never signalled,
          #    for the same reason step 4 gives below.
          ANCHOR_LINE=$(printf '%s\n' "$PR_BODY" \
            | scan -nE '^#{1,6}[[:space:]]+[Ii]ssue [Rr]eferences[[:space:]]*:?[[:space:]]*$' \
            | awk -F: 'NR == 1 { print $1 }') \
            || { echo "::error::the Issue References anchor scan did not run (grep failed) — nothing was scanned"; exit 1; }

          ANCHOR_COUNT=$(printf '%s\n' "$PR_BODY" \
            | scan -cE '^#{1,6}[[:space:]]+[Ii]ssue [Rr]eferences[[:space:]]*:?[[:space:]]*$') \
            || { echo "::error::the Issue References anchor count did not run (grep failed) — nothing was scanned"; exit 1; }

          # 3. Defensive: warn on multiple anchors (proceed with first)
          if [ "${ANCHOR_COUNT:-0}" -gt 1 ]; then
            echo "::warning::Multiple 'Issue References' headers detected ($ANCHOR_COUNT). Using first occurrence as block boundary."
          fi

          # 4. Extract content OUTSIDE the Issue References block
          #
          # `awk 'NR < n'`, NOT `head -n $((n-1))`. Both emit lines 1..n-1 — the
          # detection semantics are identical — but `head` STOPS READING once it has
          # its n-1 lines and closes the pipe. The producing `printf` then takes
          # EPIPE and fails: 141 ONLY where SIGPIPE is fatal, while a GitHub-hosted
          # runner hands the step SIGPIPE already ignored, so `printf` returns 1 with
          # a broken-pipe write error on stderr. Under `set -o pipefail` + `set -e`
          # either status kills the whole step BEFORE the scan below ever runs: the
          # check reports a red X with no scan block and no findings, which reads as
          # a detection but is an abort. DIAGNOSE IT BY THE ABSENT SCAN BLOCK, never
          # by the red X — an ordinary content failure is red too, and ON THE RUNNER
          # THIS WORKFLOW ACTUALLY RUNS ON the exit code separates nothing: SIGPIPE is
          # ignored there, so the abort exits 1 and so does a content failure. The
          # scope is the same one the sentence above carries, and it is the whole of
          # why this rule is needed: where SIGPIPE is fatal the two DO separate, 141
          # against 1, and that is not where this step runs. It only trips once a PR
          # body is long enough for `head`
          # to finish while `printf` is still writing, so it stays dormant until a
          # body that large arrives; it has fired on this repository's own history,
          # at this site. `awk` drains its input to EOF, so the producer is never
          # signalled and the pipeline exit status is honest — a genuine failure here
          # still fails the step (no `|| true` fail-open).
          if [ -z "${ANCHOR_LINE:-}" ]; then
            OUTSIDE_BLOCK="$PR_BODY"
          else
            OUTSIDE_BLOCK=$(printf '%s\n' "$PR_BODY" | awk -v n="$ANCHOR_LINE" 'NR < n')
          fi

          # 5. Canonical close-keyword scan (close-family verb immediately followed by #N)
          MATCHES=$(printf '%s\n' "$OUTSIDE_BLOCK" \
            | scan -inE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) +#?\[?[0-9]') \
            || { echo "::error::the close-keyword scan did not run (grep failed) — nothing was scanned"; exit 1; }

          # 6. Match handling
          if [ -n "$MATCHES" ]; then
            {
              echo "## :x: PR body parser-clean check FAILED"
              echo ""
              echo "Close-family verbs + \`#N\` detected OUTSIDE the dedicated Issue References block."
              echo "GitHub's auto-close parser is lexical — it matches these patterns regardless of section context or surrounding negation."
              echo ""
              echo "### Matches (line:content):"
              echo '```'
              echo "$MATCHES"
              echo '```'
              echo ""
              echo "### Remediation"
              echo ""
              echo "Use safe phrasing in every section EXCEPT the dedicated \`### Issue References\` block at the bottom of the PR body:"
              echo ""
              echo "- \`close #N\` / \`closes #N\` → \`mark #N as closed\` / \`#N → Closed\`"
              echo "- \`fixes #N\` → \`addresses #N\` / \`corrects the regression in #N\`"
              echo "- \`resolves #N\` → \`completes the work on #N\` / \`wraps up the task in #N\`"
              echo ""
              echo "See CONTRIBUTING.md for the full PR convention."
              echo ""
              echo "### Override (intentional close-keyword discussion)"
              echo ""
              echo "If this PR legitimately discusses close-keyword semantics, add an HTML-comment marker anywhere in the PR body:"
              echo ""
              echo '`<!-- pr-body-parser-clean: allow-close-keyword -->`'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ":white_check_mark: PR body parser-clean (0 matches outside Issue References block)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
