name: Depersonalization

# Blocks personal data (personal-email addresses, OS user-home paths) from entering
# the repo — in added file content, in commit messages, and in commit
# author/committer identity — and holds every commit's author and committer to the
# no-reply form CONTRIBUTING.md's ground rules ask for. It runs on every pull request
# into `main` and on every push that lands on `main`, so a commit that reaches `main`
# without a pull request is still scanned. Patterns are generic on purpose: this
# workflow ships in a public repo, so it must not itself encode any specific person's
# tokens. An operator-side local scan (kept outside the repo) covers project-specific
# tokens.
#
# CHECK 4, THE NO-REPLY FORM. Check 3 refuses a list of personal mail providers, so an
# address on any other domain passes it. Check 4 refuses every author and committer
# address outside the form, read field by field over every commit in the range. It is a
# check inside the one step below rather than a step or a job of its own for the reason
# the filter chain is: it reads the range this step resolved and goes through this
# step's control, a separate step would need a second copy of both, and a new job would
# report a context branch protection does not require until someone registers it by
# hand. The rule is not written here. It is identity_in_form in
# scripts/check-identity-form.sh, the one definition the release-tag check applies to a
# tag's tagger, and this file runs that file as a command, once per address, after the
# checkout.
#
# ITS ONE EXCEPTION is the committer noreply@github.com, exactly, on any commit. The
# host writes that committer on the merges and squashes it makes, on web-interface
# commits and on Dependabot's single-parent commits, so refusing it would turn this gate
# red after each of them had landed, and admitting it on merges alone would still refuse
# Dependabot's. The author takes no exception: the host writes its address there on
# nothing this repository has merged, and a tag takes none either.
#
# WHAT CHECK 4 CANNOT SEE.
#   - History before its first run. A commit already on `main` sits below every range
#     this job reads, and nothing is rewritten to bring it into one.
#   - A commit that reaches neither a pull request nor a push to `main`: a branch with
#     no pull request, or a commit only a pushed tag reaches. No workflow runs for those.
#   - A committer field set by hand to the host's address, which reads as the host's.
#     The author still binds on that commit.
#   - A merge the host makes, until it exists. That commit is graded on the push to
#     `main`, after it has landed: this job reports it and cannot refuse it.
#   - Whose address it is. An address in the form that belongs to someone else passes,
#     because this reads text and a no-reply address is public.
#   - A pull request that edits the rule. Its run uses the workflow and
#     scripts/check-identity-form.sh as that pull request carries them, so one that
#     widens the form, and commits under the widened shape, can pass here; only review
#     of the change to the rule can see it.
#   - A pushed branch before this job reads it. A commit is public once its branch is
#     pushed to this repository, so a refusal here, and the re-commit its hint asks for,
#     come after that commit was published, and neither unpublishes it.
#   - An identity outside the author and committer fields: a Co-authored-by or
#     Signed-off-by trailer, or a name. No check reads those but check 3, which holds
#     the commit message they sit in to its list of personal mail providers.
#   - The identity a commit's signing key is bound to, which only a verifier's own
#     mapping supplies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # gate-efficacy: posture=required
  depersonalization:
    name: Personal-data gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pushed/PR range + commit metadata for personal data
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -uo pipefail

          # Resolve the diff range from the triggering event. `github.event.pull_request`
          # is null on a push, so the PR fields cannot be read unconditionally: they would
          # resolve to empty strings and the range would collapse to "..", which git
          # rejects as a path outside the repository instead of reading it as a range.
          # The guard below names that cause before anything is scanned; each scan would
          # otherwise stop on git's error, since none of them swallows one.
          NULL_SHA='0000000000000000000000000000000000000000'
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA";     HEAD_SHA="$PR_HEAD_SHA" ;;
            push)         BASE_SHA="$PUSH_BEFORE_SHA"; HEAD_SHA="$PUSH_AFTER_SHA" ;;
            *)
              echo "::error::unsupported trigger '$EVENT_NAME' — this job defines no diff range for it."
              exit 1
              ;;
          esac

          # Fail closed: a range this job cannot read is never reported as clean.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve a diff range for event '$EVENT_NAME' (base='$BASE_SHA' head='$HEAD_SHA'). Nothing was scanned."
            exit 1
          fi
          if [ "$BASE_SHA" = "$NULL_SHA" ] || [ "$HEAD_SHA" = "$NULL_SHA" ]; then
            echo "::error::range endpoint is the null SHA — this push created or deleted the branch, so there is no before-state to diff against. Nothing was scanned."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::commit $sha is not present in this checkout — history was rewritten (force-push) or the fetch is too shallow. Nothing was scanned."
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::warning::$BASE_SHA is not an ancestor of $HEAD_SHA — history was rewritten. The content scan still compares both trees in full; the commit-metadata scan covers only commits reachable from the new tip."
          fi

          # Say what is being scanned, so a green run is self-evidencing.
          commits="$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")"
          files="$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | wc -l | tr -d ' ')"
          echo "Depersonalization gate: event=$EVENT_NAME range=$BASE_SHA..$HEAD_SHA commits=$commits files_changed=$files"
          if [ "$commits" -eq 0 ] && [ "$files" -eq 0 ]; then
            echo "::notice::range is empty — this event introduced no new commits and no file changes."
          fi

          # Generic personal-data patterns — NO project- or person-specific tokens.
          EMAIL='[A-Za-z0-9._%+-]+@(gmail|ymail|yahoo|hotmail|outlook|proton|icloud|live|aol|me)\.[A-Za-z]'
          USERPATH='/(Users|home)/[A-Za-z0-9._-]+/'

          # ── The content checks' filter chain, defined ONCE ──────────────────────────
          # The control below and checks 1 and 2 after it call these same functions, and
          # check 3 matches through the chain's last stage, so the chain the control
          # proves is, by construction, the chain that gates. That is why the control is
          # a stage of this step rather than a step of its own: steps share no shell
          # state, so a separate step would need a second copy of the chain, and a copy
          # is what drifts.
          work="$(mktemp -d)"

          # One grep stage, file to file. grep exits 0 when it matched and 1 when it
          # matched nothing — both mean the stage RAN. Any other status means it did not,
          # and the gate stops rather than report as clean a stream it never read. The
          # stages are separate commands, not one pipeline, because pipefail reports only
          # a pipeline's rightmost failure: an early stage's error would hide behind a
          # later stage's "matched nothing". Call it directly, never inside $(…) or a
          # pipeline, so that its exit ends the step and not a subshell.
          grep_stage() {  # grep_stage <in> <out> <grep args…>
            local src="$1" dst="$2" rc=0
            shift 2
            grep "$@" < "$src" > "$dst" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep $* exited $rc on this runner — a content-check stage could not run, so nothing was scanned."
              exit 1
            fi
          }

          # The added CONTENT lines of the unified diff in <in>, written to <out>. A `+`
          # line is added content only inside a hunk, so the filter follows the diff's
          # structure rather than a line's prefix: each sed range opens on a hunk header
          # and closes on the next file's `diff --git` line, and the `---`/`+++` file
          # headers after that line lie outside every range. An added line whose own
          # text begins with `++` reads `+++…` in the diff, the very shape of a file
          # header, and it is still read, because it sits inside a hunk. `[+]` is a
          # literal plus in every sed's basic regex, where `\+` is not: GNU reads a BRE
          # `\+` as "one or more", and a header filter written that way once removed
          # every added line before either check saw it. sed rather than awk, because
          # macOS awk ends a line at its first NUL byte and would hide what follows it;
          # GNU sed and BSD sed both keep the whole line. `LC_ALL=C` makes sed read
          # bytes rather than characters: in a UTF-8 locale BSD sed stops with "illegal
          # byte sequence" at a byte that is invalid there, and the filter's patterns are
          # plain ASCII, so the C locale changes nothing they match. Any status but 0
          # means the filter did not run.
          added_stage() {  # added_stage <in> <out>
            if ! LC_ALL=C sed -n '/^@@/,/^diff --git /{/^[+]/p;}' < "$1" > "$2"; then
              echo "::error::sed exited non-zero on this runner — the added-line filter could not run, so nothing was scanned."
              exit 1
            fi
          }

          # The lines of <in> matching <pattern>, written to <out>. `-a` reads every
          # line as text. Without it GNU grep treats input holding a NUL byte as binary
          # and stops printing matches once it meets one, and it drops, one at a time,
          # the lines that are invalid in the runner's locale; `-I` goes further and
          # takes everything after a NUL as a non-match. Every line in a diff comes
          # from a file git judged to be text — a binary file yields no added line at
          # all — so neither behaviour may apply here: each would hide a leak on a line
          # it skipped.
          match_stage() {  # match_stage <in> <out> <pattern>
            grep_stage "$1" "$2" -aE "$3"
          }

          # Writes <diff>.added — the added content lines of the unified diff in <diff> —
          # and <diff>.<label>, those of them matching <pattern>.
          content_scan() {  # content_scan <diff> <label> <pattern>
            added_stage "$1" "$1.added"
            match_stage "$1.added" "$1.$2" "$3"
          }
          lines_in() { wc -l < "$1" | tr -d ' '; }

          # ── Check 4's reader, defined ONCE ──────────────────────────────────────────
          # The form itself is scripts/check-identity-form.sh's, run as a command once per
          # address rather than sourced into this shell. Sourced, a line that ended that file
          # early would end this step with it, green, before the control or any check had
          # run; run, the same line answers for every address the control plants, and the
          # control turns red. A file that cannot be run stops the gate before anything is
          # scanned, because it leaves check 4 no rule.
          if [ ! -x ./scripts/check-identity-form.sh ]; then
            echo "::error::scripts/check-identity-form.sh is not in this checkout, or cannot be run, so check 4 has no rule to apply and nothing was scanned."
            exit 1
          fi
          identity_in_form() { ./scripts/check-identity-form.sh "$1"; }  # identity_in_form <address> — 0 when it is in the form
          # The exception compares a whole string, so nothing longer or shorter is the host.
          host_committer='noreply@github.com'

          # Grades <records>, four lines to a commit — its id, its parents, its author's
          # address, its committer's — and writes one `<id> <field> <address>` line to <hits>
          # for each address refused. Four lines rather than four fields of one, because an
          # address cannot hold a newline and can hold any separator a field would use. The
          # author goes to the rule alone; the committer goes to the rule unless it is the
          # host. The parents decide nothing: they only count the merges admitted, so that a
          # log says what was admitted, and the control carries merges and single-parent
          # commits so that an exception narrowed to merges fails it. Sets id_commits, id_host
          # and id_host_merges in this shell, so call it directly, never inside $(…).
          identity_scan() {  # identity_scan <records> <hits>
            local id parents author committer
            id_commits=0; id_host=0; id_host_merges=0
            : > "$2"
            while IFS= read -r id; do
              if ! { IFS= read -r parents && IFS= read -r author && IFS= read -r committer; }; then
                echo "::error::a commit record in $1 ended early, so its identities could not be graded and nothing was scanned."
                exit 1
              fi
              id_commits=$((id_commits + 1))
              if ! identity_in_form "$author"; then
                printf '%s author %s\n' "${id:0:12}" "${author:-(empty)}" >> "$2"
              fi
              if [ "$committer" = "$host_committer" ]; then
                id_host=$((id_host + 1))
                case "$parents" in *' '*) id_host_merges=$((id_host_merges + 1)) ;; esac
              elif ! identity_in_form "$committer"; then
                printf '%s committer %s\n' "${id:0:12}" "${committer:-(empty)}" >> "$2"
              fi
            done < "$1"
          }

          # ── Control: every check catches a planted leak, and only where it looks ─────
          # Runs before anything is scanned, through content_scan and identity_scan
          # themselves, on this runner's tools. It proves the rules and the scans, not the
          # reads or the verdict: check 4's git log line, its count guard and fail=1 sit
          # outside it, as checks 1 to 3's reads of the range do. The planted values are ASSEMBLED here
          # rather than written out: this job scans its own source whenever this file is in
          # the range, and a committed literal would be refused by the very checks it exists
          # to prove.
          at='@'
          home_seg='home'
          planted_email="gate.selftest${at}gmail.com"
          planted_path="/${home_seg}/gate-selftest/notes"

          # FIRE — a new SVG adding five lines, each carrying a planted value where a
          # chain that reads less than every byte of every added line would lose it:
          # after a NUL byte, plainly, in a line whose own text begins `++` (so that in
          # the diff it has exactly the shape of a `+++ b/<path>` file header), and after
          # a byte that is invalid in UTF-8. A text file's NUL can reach a diff, because
          # git looks for one only in a file's first 8,000 bytes. printf's format string
          # writes the NUL and the invalid byte (octal 351), since a shell variable
          # cannot hold a NUL. Five added content lines; the email check reports two of
          # them and the path check three.
          {
            printf '%s\n' \
              'diff --git a/fig.svg b/fig.svg' \
              'new file mode 100644' \
              '--- /dev/null' \
              '+++ b/fig.svg' \
              '@@ -0,0 +1,5 @@'
            printf '+<desc>\000 kept for %s</desc>\n' "$planted_email"
            printf '%s\n' \
              "+<text x=\"8\" y=\"16\">write to ${planted_email}</text>" \
              "+<text x=\"8\" y=\"32\">notes kept in ${planted_path}</text>" \
              "+++ b${planted_path}"
            printf '+<desc>\351 %s</desc>\n' "$planted_path"
          } > "$work/fire.diff"

          # QUIET — the same values only where a check must NOT look, beside clean added
          # lines: a file header's path and a removed line. The header belongs to a
          # SECOND file and follows the first file's hunk, because that is where a
          # filter whose hunk never closed would take it for content; a first file's
          # header cannot show that. Two added content lines; neither check reports
          # anything. The header is what makes the control specific to the filter — a
          # filter that dropped nothing would pass FIRE and fail here.
          quiet_file="fixture${planted_path}/${planted_email}.md"
          printf '%s\n' \
            'diff --git a/notes.md b/notes.md' \
            '--- a/notes.md' \
            '+++ b/notes.md' \
            '@@ -1 +1 @@' \
            '-an older clean line' \
            '+a newer clean line' \
            "diff --git a/${quiet_file} b/${quiet_file}" \
            "--- a/${quiet_file}" \
            "+++ b/${quiet_file}" \
            '@@ -1 +1 @@' \
            "-write to ${planted_email}; notes kept in ${planted_path}" \
            '+write to the maintainer through the repository' \
            > "$work/quiet.diff"

          for arm in fire quiet; do
            content_scan "$work/$arm.diff" email "$EMAIL"
            content_scan "$work/$arm.diff" path "$USERPATH"
          done

          # ID-FIRE — fifteen commits, each carrying exactly one address check 4 must refuse.
          # Each commit's id opens with the field that must be refused, so the count below
          # holds an arm to its own field: a rule that refused the wrong one, or refused one
          # address twice while passing another, cannot reach the wanted count. The ids and the
          # no-reply values are not real: GitHub issues no account the id 0 and no login a
          # doubled hyphen. An address the rule must take beside the one it must refuse is
          # the in-form value, and the host's address is written only where it is the subject.
          form="users.noreply.github.com"
          in_form="0+gate--selftest${at}${form}"
          id_record() { printf '%s\n' "$1" "$2" "$3" "$4"; }  # <id> <parents> <author> <committer>
          {
            id_record author-01 p "outside${at}example.org" "$in_form"
            id_record author-02 p "$host_committer" "$in_form"
            id_record author-03 p "$host_committer" "$host_committer"
            id_record author-04 p "0+gate--selftest${at}${form}.example.org" "$in_form"
            id_record author-05 p "0+gate--selftest${at}noreply.github.com" "$in_form"
            id_record author-06 p "0+gate--selftest${at}USERS.NOREPLY.GITHUB.COM" "$in_form"
            id_record author-07 p "${planted_email}${at}${form}" "$in_form"
            id_record author-08 p "" "$in_form"
            id_record committer-01 p "$in_form" "outside${at}example.org"
            id_record committer-02 p "$in_form" "${host_committer}.example.org"
            id_record committer-03 p "$in_form" "x-${host_committer}"
            id_record committer-04 p "$in_form" "NOREPLY${at}GITHUB.COM"
            id_record committer-05 p "$in_form" "0+gate--selftest${at}${form}.example.org"
            id_record committer-06 p "$in_form" "0+gate--selftest${at}noreply.github.com"
            id_record committer-07 p "$in_form" ""
          } > "$work/id-fire"
          identity_scan "$work/id-fire" "$work/id-fire.hits"
          id_fire_own="$(awk 'index($1, $2) == 1 && !seen[$1]++ { n++ } END { print n + 0 }' < "$work/id-fire.hits")"
          id_fire="ID-FIRE commits=$id_commits refused=$(lines_in "$work/id-fire.hits") own-field=$id_fire_own"

          # ID-QUIET — eight commits it must pass: the form with and without an id, a bot in
          # both, the host committer on a merge and on single-parent commits, a root commit
          # and a merge made outside the host. Three admitted as the host, one on a merge.
          {
            id_record quiet-01 p "$in_form" "$in_form"
            id_record quiet-02 p "0+gate--selftest[bot]${at}${form}" "$host_committer"
            id_record quiet-03 'p q' "$in_form" "$host_committer"
            id_record quiet-04 p "$in_form" "$host_committer"
            id_record quiet-05 p "gate--selftest${at}${form}" "gate--selftest${at}${form}"
            id_record quiet-06 p "gate--selftest[bot]${at}${form}" "$in_form"
            id_record quiet-07 '' "$in_form" "$in_form"
            id_record quiet-08 'p q' "$in_form" "$in_form"
          } > "$work/id-quiet"
          identity_scan "$work/id-quiet" "$work/id-quiet.hits"
          id_quiet="ID-QUIET commits=$id_commits refused=$(lines_in "$work/id-quiet.hits") host=$id_host host-merges=$id_host_merges"

          grep_version="$(grep --version | sed -n 1p)"
          measured="FIRE added=$(lines_in "$work/fire.diff.added") email=$(lines_in "$work/fire.diff.email") path=$(lines_in "$work/fire.diff.path"); QUIET added=$(lines_in "$work/quiet.diff.added") email=$(lines_in "$work/quiet.diff.email") path=$(lines_in "$work/quiet.diff.path"); $id_fire; $id_quiet"
          wanted='FIRE added=5 email=2 path=3; QUIET added=2 email=0 path=0; ID-FIRE commits=15 refused=15 own-field=15; ID-QUIET commits=8 refused=0 host=3 host-merges=1'
          if [ "$measured" != "$wanted" ]; then
            echo "::error::control failed on ${grep_version} — measured ${measured}; wanted ${wanted}. Checks 1 to 4 cannot be trusted to read what they are given, so nothing was scanned."
            exit 1
          fi
          echo "Control passed on ${grep_version} — ${measured}."

          # Writes <diff>, the range's unified diff limited to <pathspec…>, and
          # <diff>.numstat, git's own per-file count of the lines that range adds and
          # removes under the same pathspec, so that "the same range and pathspec" is
          # true by construction rather than by two copies agreeing. Both are taken at
          # ZERO lines of context. git's count of added lines can depend on the context
          # length: on a clean commit in this repository's history, one unchanged line
          # is removed and re-added at zero context and left alone at three, so a
          # numstat at its default context can disagree with the patch the checks
          # read. `diff.context` sets numstat's context without asking for a patch,
          # where `--unified` would add one to its output.
          read_range() {  # read_range <diff> <check> <pathspec…>
            local diff="$1" check="$2"
            shift 2
            if ! git diff --unified=0 "$BASE_SHA".."$HEAD_SHA" -- "$@" > "$diff"; then
              echo "::error::git diff could not read the range for check $check, so nothing was scanned."
              exit 1
            fi
            if ! git -c diff.context=0 diff --numstat "$BASE_SHA".."$HEAD_SHA" -- "$@" > "$diff.numstat"; then
              echo "::error::git diff --numstat could not count the range for check $check, so nothing was scanned."
              exit 1
            fi
          }

          # Stops the gate unless the added content lines content_scan read from <diff>
          # number exactly what git counts for the same range. A line the chain loses
          # without an error — to a byte some tool takes for binary, or to a diff shape
          # no filter anticipated — would otherwise pass as a clean line, and nothing
          # else compares the two. A binary file's numstat row reads `-` and adds
          # nothing, because git emits no content line for it either. The counts are
          # compared as strings: `[ -ne ]` on an empty operand exits 2, which an `if`
          # reads as "not different".
          added_agrees() {  # added_agrees <diff> <check>
            local got want
            got="$(lines_in "$1.added")" \
              || { echo "::error::could not count the added lines check $2 read, so its result cannot be trusted."; exit 1; }
            want="$(awk '$1 != "-" { n += $1 } END { print n + 0 }' < "$1.numstat")" \
              || { echo "::error::could not total git's own added-line count for check $2, so its result cannot be trusted."; exit 1; }
            if [ "$got" != "$want" ]; then
              echo "::error::check $2 read $got added line(s) where git counts $want for the same range — lines were lost or invented between git and the match, so nothing check $2 reported can be trusted."
              exit 1
            fi
          }

          fail=0

          # 1. Personal email in ADDED lines — every file EXCEPT the intentional
          #    contact homes (LICENSE, SECURITY.md) where an owner email is allowed.
          read_range "$work/email.diff" 1 . ':(exclude)LICENSE' ':(exclude)SECURITY.md'
          content_scan "$work/email.diff" hits "$EMAIL"
          added_agrees "$work/email.diff" 1
          if [ -s "$work/email.diff.hits" ]; then
            echo "::error::personal email address found in added lines (allowed only in LICENSE / SECURITY.md)"
            cat "$work/email.diff.hits"
            fail=1
          fi

          # 2. OS user-home path in ADDED lines — never allowed.
          read_range "$work/path.diff" 2 .
          content_scan "$work/path.diff" hits "$USERPATH"
          added_agrees "$work/path.diff" 2
          if [ -s "$work/path.diff.hits" ]; then
            echo "::error::OS user-home path (/Users/<name>/ or /home/<name>/) found in added lines"
            cat "$work/path.diff.hits"
            fail=1
          fi

          # Say how many added lines each check read, so a green over zero added lines
          # reads differently from a clean one.
          echo "Added lines scanned: $(lines_in "$work/email.diff.added") by check 1 (LICENSE and SECURITY.md excluded), $(lines_in "$work/path.diff.added") by check 2, each equal to git's own count."
          if [ "$(lines_in "$work/path.diff.added")" -eq 0 ]; then
            echo "::notice::this range adds no content lines — checks 1 and 2 had nothing to read."
          fi

          # 3. Commit messages + author/committer identity across the PR's commits.
          #    Catches a personal-email author identity re-entering history. Read and
          #    matched as checks 1 and 2 are: a range git log cannot read stops the gate
          #    rather than scanning as clean, and the match is the chain's own last stage.
          if ! git log --format='%B%n%an <%ae>%n%cn <%ce>' "$BASE_SHA".."$HEAD_SHA" > "$work/meta"; then
            echo "::error::git log could not read the range for check 3, so no commit message or identity was scanned."
            exit 1
          fi
          match_stage "$work/meta" "$work/meta.hits" "$EMAIL|$USERPATH"
          if [ -s "$work/meta.hits" ]; then
            echo "::error::personal data in a commit message or author/committer identity"
            cat "$work/meta.hits"
            echo "Hint: commit with a GitHub noreply email (Settings - Emails - keep my email private)."
            fail=1
          fi

          # 4. The no-reply form, on the author and committer of every commit in the range.
          #    Read as check 3 is, and held to git's own count as checks 1 and 2 are: a record
          #    this check lost would otherwise pass as a commit with nothing wrong with it.
          if ! git log --format='%H%n%P%n%ae%n%ce' "$BASE_SHA".."$HEAD_SHA" > "$work/ids"; then
            echo "::error::git log could not read the range for check 4, so no identity was graded."
            exit 1
          fi
          identity_scan "$work/ids" "$work/ids.hits"
          if [ "$id_commits" != "$commits" ]; then
            echo "::error::check 4 read $id_commits commit(s) where git counts $commits for the same range — commits were lost or invented between git and the rule, so nothing check 4 reported can be trusted."
            exit 1
          fi
          if [ -s "$work/ids.hits" ]; then
            echo "::error::commit author or committer outside the no-reply form (…@users.noreply.github.com)"
            cat "$work/ids.hits"
            echo "Hint: set this clone's user.email to your no-reply address (GIT_AUTHOR_EMAIL and GIT_COMMITTER_EMAIL, when set, override it), then re-commit these on your branch with the author reset: git commit --amend --no-edit --reset-author for the last commit, or git rebase --exec 'git commit --amend --no-edit --reset-author' <base> for several. CONTRIBUTING.md, Ground rules states the form; a commit already on main is not rewritten. A shape GitHub issues that the form does not take yet is added in scripts/check-identity-form.sh, and only there."
            fail=1
          fi

          # Say how many identities check 4 read and what it admitted, so a green over no
          # commit reads differently from a clean one and a host-made merge shows as admitted.
          echo "Commit identities read by check 4: $id_commits commit(s), $((id_commits * 2)) address(es), equal to git's own count; $(lines_in "$work/ids.hits") refused; the committer $host_committer admitted on $id_host commit(s), $id_host_merges of them merges."
          if [ "$id_commits" -eq 0 ]; then
            echo "::notice::this range holds no commit — check 4 had nothing to read."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Depersonalization gate FAILED."
            exit 1
          fi
          echo "Depersonalization gate clean — no personal data, and every commit identity in the no-reply form, in this range."
