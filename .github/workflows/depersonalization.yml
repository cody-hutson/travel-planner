name: Depersonalization

# Blocks personal data (personal-email addresses, OS user-home paths) from entering
# the repo — in added file content, in commit messages, and in commit
# author/committer identity. It runs on every pull request into `main` and on every
# push that lands on `main`, so a commit that reaches `main` without a pull request
# is still scanned. Patterns are generic on purpose: this workflow ships in a public
# repo, so it must not itself encode any specific person's tokens. An operator-side
# local scan (kept outside the repo) covers project-specific tokens.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  depersonalization:
    name: Personal-data gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pushed/PR range + commit metadata for personal data
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -uo pipefail

          # Resolve the diff range from the triggering event. `github.event.pull_request`
          # is null on a push, so the PR fields cannot be read unconditionally: they would
          # resolve to empty strings and the range would collapse to "..", which one of the
          # three scans below accepts silently and the other two error into `|| true` —
          # a gate that reports success having read nothing.
          NULL_SHA='0000000000000000000000000000000000000000'
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA";     HEAD_SHA="$PR_HEAD_SHA" ;;
            push)         BASE_SHA="$PUSH_BEFORE_SHA"; HEAD_SHA="$PUSH_AFTER_SHA" ;;
            *)
              echo "::error::unsupported trigger '$EVENT_NAME' — this job defines no diff range for it."
              exit 1
              ;;
          esac

          # Fail closed: a range this job cannot read is never reported as clean.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve a diff range for event '$EVENT_NAME' (base='$BASE_SHA' head='$HEAD_SHA'). Nothing was scanned."
            exit 1
          fi
          if [ "$BASE_SHA" = "$NULL_SHA" ] || [ "$HEAD_SHA" = "$NULL_SHA" ]; then
            echo "::error::range endpoint is the null SHA — this push created or deleted the branch, so there is no before-state to diff against. Nothing was scanned."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::commit $sha is not present in this checkout — history was rewritten (force-push) or the fetch is too shallow. Nothing was scanned."
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::warning::$BASE_SHA is not an ancestor of $HEAD_SHA — history was rewritten. The content scan still compares both trees in full; the commit-metadata scan covers only commits reachable from the new tip."
          fi

          # Say what is being scanned, so a green run is self-evidencing.
          commits="$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")"
          files="$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | wc -l | tr -d ' ')"
          echo "Depersonalization gate: event=$EVENT_NAME range=$BASE_SHA..$HEAD_SHA commits=$commits files_changed=$files"
          if [ "$commits" -eq 0 ] && [ "$files" -eq 0 ]; then
            echo "::notice::range is empty — this event introduced no new commits and no file changes."
          fi

          # Generic personal-data patterns — NO project- or person-specific tokens.
          EMAIL='[A-Za-z0-9._%+-]+@(gmail|ymail|yahoo|hotmail|outlook|proton|icloud|live|aol|me)\.[A-Za-z]'
          USERPATH='/(Users|home)/[A-Za-z0-9._-]+/'

          fail=0

          # 1. Personal email in ADDED lines — every file EXCEPT the intentional
          #    contact homes (LICENSE, SECURITY.md) where an owner email is allowed.
          email_hits="$(git diff --unified=0 "$BASE_SHA".."$HEAD_SHA" -- . ':(exclude)LICENSE' ':(exclude)SECURITY.md' \
            | grep -E '^\+' | grep -v '^\+\+\+' | grep -EI "$EMAIL" || true)"
          if [ -n "$email_hits" ]; then
            echo "::error::personal email address found in added lines (allowed only in LICENSE / SECURITY.md)"
            printf '%s\n' "$email_hits"
            fail=1
          fi

          # 2. OS user-home path in ADDED lines — never allowed.
          path_hits="$(git diff --unified=0 "$BASE_SHA".."$HEAD_SHA" \
            | grep -E '^\+' | grep -v '^\+\+\+' | grep -EI "$USERPATH" || true)"
          if [ -n "$path_hits" ]; then
            echo "::error::OS user-home path (/Users/<name>/ or /home/<name>/) found in added lines"
            printf '%s\n' "$path_hits"
            fail=1
          fi

          # 3. Commit messages + author/committer identity across the PR's commits.
          #    Catches a personal-email author identity re-entering history.
          meta="$(git log --format='%B%n%an <%ae>%n%cn <%ce>' "$BASE_SHA".."$HEAD_SHA" || true)"
          meta_hits="$(printf '%s\n' "$meta" | grep -EI "$EMAIL|$USERPATH" || true)"
          if [ -n "$meta_hits" ]; then
            echo "::error::personal data in a commit message or author/committer identity"
            printf '%s\n' "$meta_hits"
            echo "Hint: commit with a GitHub noreply email (Settings - Emails - keep my email private)."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Depersonalization gate FAILED."
            exit 1
          fi
          echo "Depersonalization gate clean — no personal data in this range."
