name: Depersonalization

# Blocks personal data (personal-email addresses, OS user-home paths) from entering
# the repo — in added file content, in commit messages, and in commit
# author/committer identity. It runs on every pull request into `main` and on every
# push that lands on `main`, so a commit that reaches `main` without a pull request
# is still scanned. Patterns are generic on purpose: this workflow ships in a public
# repo, so it must not itself encode any specific person's tokens. An operator-side
# local scan (kept outside the repo) covers project-specific tokens.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # gate-efficacy: posture=required
  depersonalization:
    name: Personal-data gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pushed/PR range + commit metadata for personal data
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -uo pipefail

          # Resolve the diff range from the triggering event. `github.event.pull_request`
          # is null on a push, so the PR fields cannot be read unconditionally: they would
          # resolve to empty strings and the range would collapse to "..", which the email
          # scan below accepts silently as an empty diff and the metadata scan errors into
          # its `|| true` — a gate that reports success having read nothing.
          NULL_SHA='0000000000000000000000000000000000000000'
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA";     HEAD_SHA="$PR_HEAD_SHA" ;;
            push)         BASE_SHA="$PUSH_BEFORE_SHA"; HEAD_SHA="$PUSH_AFTER_SHA" ;;
            *)
              echo "::error::unsupported trigger '$EVENT_NAME' — this job defines no diff range for it."
              exit 1
              ;;
          esac

          # Fail closed: a range this job cannot read is never reported as clean.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::could not resolve a diff range for event '$EVENT_NAME' (base='$BASE_SHA' head='$HEAD_SHA'). Nothing was scanned."
            exit 1
          fi
          if [ "$BASE_SHA" = "$NULL_SHA" ] || [ "$HEAD_SHA" = "$NULL_SHA" ]; then
            echo "::error::range endpoint is the null SHA — this push created or deleted the branch, so there is no before-state to diff against. Nothing was scanned."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::commit $sha is not present in this checkout — history was rewritten (force-push) or the fetch is too shallow. Nothing was scanned."
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::warning::$BASE_SHA is not an ancestor of $HEAD_SHA — history was rewritten. The content scan still compares both trees in full; the commit-metadata scan covers only commits reachable from the new tip."
          fi

          # Say what is being scanned, so a green run is self-evidencing.
          commits="$(git rev-list --count "$BASE_SHA".."$HEAD_SHA")"
          files="$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" | wc -l | tr -d ' ')"
          echo "Depersonalization gate: event=$EVENT_NAME range=$BASE_SHA..$HEAD_SHA commits=$commits files_changed=$files"
          if [ "$commits" -eq 0 ] && [ "$files" -eq 0 ]; then
            echo "::notice::range is empty — this event introduced no new commits and no file changes."
          fi

          # Generic personal-data patterns — NO project- or person-specific tokens.
          EMAIL='[A-Za-z0-9._%+-]+@(gmail|ymail|yahoo|hotmail|outlook|proton|icloud|live|aol|me)\.[A-Za-z]'
          USERPATH='/(Users|home)/[A-Za-z0-9._-]+/'

          # ── The content checks' filter chain, defined ONCE ──────────────────────────
          # The control below and checks 1 and 2 after it call these same functions, so
          # the chain the control proves is, by construction, the chain that gates. That
          # is why the control is a stage of this step rather than a step of its own:
          # steps share no shell state, so a separate step would need a second copy of
          # the chain, and a copy is what drifts.
          work="$(mktemp -d)"

          # One grep stage, file to file. grep exits 0 when it matched and 1 when it
          # matched nothing — both mean the stage RAN. Any other status means it did not,
          # and the gate stops rather than report as clean a stream it never read. The
          # stages are separate commands, not one pipeline, because pipefail reports only
          # a pipeline's rightmost failure: an early stage's error would hide behind a
          # later stage's "matched nothing". Call it directly, never inside $(…) or a
          # pipeline, so that its exit ends the step and not a subshell.
          grep_stage() {  # grep_stage <in> <out> <grep args…>
            local src="$1" dst="$2" rc=0
            shift 2
            grep "$@" < "$src" > "$dst" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::grep $* exited $rc on this runner — a content-check stage could not run, so nothing was scanned."
              exit 1
            fi
          }

          # Writes <diff>.added — the added CONTENT lines of the unified diff in <diff>,
          # every `+` line except the `+++ b/<path>` file headers — and <diff>.<label>,
          # those of them matching <pattern>. Both filters are EREs on purpose: in an
          # ERE `\+` is a literal plus under every grep, and in a BRE it is not. The
          # header filter was once the BRE `grep -v '^\+\+\+'`. GNU grep, this runner's,
          # reads that as "a line starting with one or more `+`", so it removed every
          # added line; BSD grep and ugrep reject it outright, and a `|| true` absorbed
          # the error. Either way checks 1 and 2 could never report anything.
          # Residual, stated rather than left to be found: an added line whose own
          # content begins with `++` reads as `+++…` in the diff and is dropped with the
          # headers.
          content_scan() {  # content_scan <diff> <label> <pattern>
            grep_stage "$1" "$1.plus" -E '^\+'
            grep_stage "$1.plus" "$1.added" -Ev '^\+\+\+'
            grep_stage "$1.added" "$1.$2" -EI "$3"
          }
          lines_in() { wc -l < "$1" | tr -d ' '; }

          # ── Control: both checks catch a planted leak, and only where they look ─────
          # Runs before anything is scanned, through content_scan itself, on this
          # runner's grep. The planted values are ASSEMBLED here rather than written out:
          # this job scans its own source whenever this file is in the range, and a
          # committed literal would be refused by the very checks it exists to prove.
          at='@'
          home_seg='home'
          planted_email="gate.selftest${at}gmail.com"
          planted_path="/${home_seg}/gate-selftest/notes"

          # FIRE — a new SVG adding one line that carries the email and one that carries
          # the path. Two added content lines; each check reports exactly its own.
          printf '%s\n' \
            'diff --git a/fig.svg b/fig.svg' \
            'new file mode 100644' \
            '--- /dev/null' \
            '+++ b/fig.svg' \
            '@@ -0,0 +1,2 @@' \
            "+<text x=\"8\" y=\"16\">write to ${planted_email}</text>" \
            "+<text x=\"8\" y=\"32\">notes kept in ${planted_path}</text>" \
            > "$work/fire.diff"

          # QUIET — the same values only where a check must NOT look: a file header's
          # path and a removed line, beside one clean added line. One added content
          # line; neither check reports anything. The header is what makes the control
          # specific to the filter — a filter that dropped nothing would pass FIRE and
          # fail here.
          quiet_file="fixture${planted_path}/${planted_email}.md"
          printf '%s\n' \
            "diff --git a/${quiet_file} b/${quiet_file}" \
            "--- a/${quiet_file}" \
            "+++ b/${quiet_file}" \
            '@@ -1 +1 @@' \
            "-write to ${planted_email}; notes kept in ${planted_path}" \
            '+write to the maintainer through the repository' \
            > "$work/quiet.diff"

          for arm in fire quiet; do
            content_scan "$work/$arm.diff" email "$EMAIL"
            content_scan "$work/$arm.diff" path "$USERPATH"
          done
          grep_version="$(grep --version | sed -n 1p)"
          measured="FIRE added=$(lines_in "$work/fire.diff.added") email=$(lines_in "$work/fire.diff.email") path=$(lines_in "$work/fire.diff.path"); QUIET added=$(lines_in "$work/quiet.diff.added") email=$(lines_in "$work/quiet.diff.email") path=$(lines_in "$work/quiet.diff.path")"
          wanted='FIRE added=2 email=1 path=1; QUIET added=1 email=0 path=0'
          if [ "$measured" != "$wanted" ]; then
            echo "::error::content-check control failed on ${grep_version} — measured ${measured}; wanted ${wanted}. Checks 1 and 2 cannot be trusted to read added lines, so nothing was scanned."
            exit 1
          fi
          echo "Content-check control passed on ${grep_version} — ${measured}."

          fail=0

          # 1. Personal email in ADDED lines — every file EXCEPT the intentional
          #    contact homes (LICENSE, SECURITY.md) where an owner email is allowed.
          git diff --unified=0 "$BASE_SHA".."$HEAD_SHA" -- . ':(exclude)LICENSE' ':(exclude)SECURITY.md' \
            > "$work/email.diff" \
            || { echo "::error::git diff could not read the range for check 1, so nothing was scanned."; exit 1; }
          content_scan "$work/email.diff" hits "$EMAIL"
          if [ -s "$work/email.diff.hits" ]; then
            echo "::error::personal email address found in added lines (allowed only in LICENSE / SECURITY.md)"
            cat "$work/email.diff.hits"
            fail=1
          fi

          # 2. OS user-home path in ADDED lines — never allowed.
          git diff --unified=0 "$BASE_SHA".."$HEAD_SHA" \
            > "$work/path.diff" \
            || { echo "::error::git diff could not read the range for check 2, so nothing was scanned."; exit 1; }
          content_scan "$work/path.diff" hits "$USERPATH"
          if [ -s "$work/path.diff.hits" ]; then
            echo "::error::OS user-home path (/Users/<name>/ or /home/<name>/) found in added lines"
            cat "$work/path.diff.hits"
            fail=1
          fi

          # Say how many added lines each check read, so a green over zero added lines
          # reads differently from a clean one.
          echo "Added lines scanned: $(lines_in "$work/email.diff.added") by check 1 (LICENSE and SECURITY.md excluded), $(lines_in "$work/path.diff.added") by check 2."
          if [ "$(lines_in "$work/path.diff.added")" -eq 0 ]; then
            echo "::notice::this range adds no content lines — checks 1 and 2 had nothing to read."
          fi

          # 3. Commit messages + author/committer identity across the PR's commits.
          #    Catches a personal-email author identity re-entering history.
          meta="$(git log --format='%B%n%an <%ae>%n%cn <%ce>' "$BASE_SHA".."$HEAD_SHA" || true)"
          meta_hits="$(printf '%s\n' "$meta" | grep -EI "$EMAIL|$USERPATH" || true)"
          if [ -n "$meta_hits" ]; then
            echo "::error::personal data in a commit message or author/committer identity"
            printf '%s\n' "$meta_hits"
            echo "Hint: commit with a GitHub noreply email (Settings - Emails - keep my email private)."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Depersonalization gate FAILED."
            exit 1
          fi
          echo "Depersonalization gate clean — no personal data in this range."
