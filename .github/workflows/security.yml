name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# travel-planner ships no application source code, so the conventional SAST +
# dependency-audit + secret-scan triple is adapted for a markdown agent-prompt repo. What each
# job runs, in order:
#   actionlint           the required-check registration census step, which runs
#                        scripts/pin-required-checks.py --self-test and then --census; then
#                        actionlint over every workflow file, after the step that asserts the
#                        shellcheck actionlint runs on each run: block
#   markdown-link-check  every local [text](path) link in a tracked markdown file resolves
#   gitleaks             the trip-data ignore invariant; then gitleaks over the full history
#
# Whether a job here binds a merge is declared BY THAT JOB, on the
# `# gate-efficacy: posture=` line above its key, and graded against the committed
# context list by the registration census step in the actionlint job below.
#
# ── WHAT THIS WORKFLOW DOWNLOADS, AND HOW EACH DOWNLOAD IS PINNED ─────────────────
# actionlint and gitleaks are upstream release assets. Each is fixed by a version and refused
# unless its SHA-256 matches the digest beside that version in its job's env, before it is
# unpacked or run; a mismatch fails the step, and nothing falls back to an unverified download.
# Each digest was read from the checksums file that same upstream release publishes. That
# proves the bytes run here are the bytes the release served when its pin was read, so any later
# change to what upstream serves under that name fails this check instead of running. It does
# not prove the release itself was sound: a compromised release that published a matching
# checksums file would have been pinned as readily. Moving a pin is one edit to a version and
# its digest together, read from that version's checksums file.
#
# ── WHICH SHELLCHECK ACTIONLINT RUNS, AND HOW IT IS PINNED ───────────────────────
# Not a download. actionlint runs the shellcheck the ubuntu-24.04 runner image installs from
# Ubuntu's package archive, whose packages apt checks against the archive's signed index when
# the image is built. It is pinned BY VERSION, not by a digest in this file: the step before
# actionlint refuses unless dpkg records the file at SHELLCHECK_PATH as installed by the
# image's shellcheck package and that file reports SHELLCHECK_EXPECT_VERSION, and actionlint
# is pointed at that same path. A missing binary is refused too, because actionlint would
# otherwise lint without shellcheck and say nothing. Findings differ between shellcheck
# versions, so an image that moves the version turns this check red instead of changing its
# verdict silently; a rebuild of the package at the same upstream version passes. It is not
# the version shell-lint.yml downloads for scripts/*.sh, by design: moving actionlint onto
# that pin can change this check's findings on every workflow, so it is a change of its own.

jobs:
  # gate-efficacy: posture=required
  actionlint:
    name: Workflow SAST (actionlint)
    runs-on: ubuntu-24.04
    env:
      # The download pin: one upstream release of actionlint, and the SHA-256 of its linux amd64
      # tarball as that release's checksums file lists it. Move both together.
      ACTIONLINT_VERSION: '1.7.1'
      ACTIONLINT_SHA256: 'f53c34493657dfea83b657e4b62cc68c25fbc383dff64c8d581613b037aacaa3'
      # The shellcheck actionlint runs: the runner image's own, pinned by version (header).
      SHELLCHECK_PATH: '/usr/bin/shellcheck'
      SHELLCHECK_EXPECT_VERSION: '0.9.0'
    steps:
      - uses: actions/checkout@v7

      # Same subject matter as actionlint — a property of the workflow YAML — so it
      # rides this job rather than adding a new check name (which would need a
      # branch-protection change). Runs BEFORE the actionlint install so a transient
      # network failure there cannot mask a real registration finding.
      # The self-test runs first and grades the instrument. It is offline, and the one
      # repository file it reads is SECURITY.md, whose required-check list it holds to
      # CONTEXT_ORDER; its census arms grade synthetic trees. Both commands always run,
      # so a red self-test never hides the census verdict, and the step fails if either
      # does. Both need the PyYAML the runner image carries, under the python3 found on
      # PATH: a setup-python step added ahead of this one would put a Python without
      # PyYAML first, and the census would then refuse at exit 2 while the self-test
      # reported its census group NOT-EVALUATED. The job is pinned to ubuntu-24.04, the
      # image on which that PyYAML was probed, rather than to ubuntu-latest: a move to
      # another image is then a reviewed pull request, on which this step proves the
      # parser again. The actionlint steps below run even when this one fails, so a red
      # self-test or census never hides actionlint's verdict; the job still fails.
      - name: Required-check registration census
        run: |
          st=0
          ce=0
          ./scripts/pin-required-checks.py --self-test || st=$?
          ./scripts/pin-required-checks.py --census || ce=$?
          echo "self-test exit $st, census exit $ce"
          [ "$st" -eq 0 ] && [ "$ce" -eq 0 ]

      # No fallback to an unverified download: a mismatch fails this step, nothing is
      # unpacked, and actionlint below does not run.
      - name: Install actionlint
        id: actionlint_install
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$tarball" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      # The shellcheck actionlint runs, asserted before it runs (header). It reads what the
      # image installed and downloads nothing; actionlint below is pointed at the same path.
      # The ownership limb reads dpkg's record of the file, not the file's content.
      - name: Assert actionlint's shellcheck
        id: shellcheck_assert
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          printf 'shellcheck on PATH: %s\n' "$(command -v shellcheck || echo none)"
          if [ ! -x "$SHELLCHECK_PATH" ]; then
            echo "::error::no executable at $SHELLCHECK_PATH -- actionlint would lint without shellcheck and say nothing"
            exit 1
          fi
          if ! owner="$(dpkg-query -S "$SHELLCHECK_PATH" 2>&1)"; then
            echo "::error::no installed package owns $SHELLCHECK_PATH ($owner) -- actionlint would lint without the shellcheck this job pins"
            exit 1
          fi
          # dpkg-query -S prints "<package>[:<arch>]: <path>". The architecture qualifier is
          # tolerated; any other package, a second line or another path is refused.
          owner_pkg="${owner%%: *}"
          owner_path="${owner#*: }"
          if [ "${owner_pkg%%:*}" != "shellcheck" ] || [ "$owner_path" != "$SHELLCHECK_PATH" ]; then
            echo "::error::dpkg does not record $SHELLCHECK_PATH as installed by the image's shellcheck package ($owner)"
            exit 1
          fi
          pkg_version="$(dpkg-query -W -f="\${Version}" shellcheck)"
          sc_version="$("$SHELLCHECK_PATH" --version | awk '$1 == "version:" { print $2 }')"
          printf 'shellcheck at %s: package shellcheck %s, reports %s\n' \
            "$SHELLCHECK_PATH" "$pkg_version" "${sc_version:-no version}"
          if [ "$sc_version" != "$SHELLCHECK_EXPECT_VERSION" ]; then
            echo "::error::shellcheck reports ${sc_version:-no version}, not the pinned $SHELLCHECK_EXPECT_VERSION -- findings differ between versions"
            exit 1
          fi

      - name: Run actionlint
        if: ${{ !cancelled() && steps.actionlint_install.outcome == 'success' && steps.shellcheck_assert.outcome == 'success' }}
        # The -ignore flag suppresses shellcheck SC2016 propagation out of
        # pr-body-parser-clean.yml. The justification is structural rather than
        # provenance: that workflow echoes the override marker into the step
        # summary wrapped in markdown backticks, inside single quotes so the
        # backticks are not read as command substitution — two such strings,
        # both in report-only blocks. SC2016 flags exactly that shape, so the
        # suppression stays load-bearing while they do.
        # actionlint v1.7.1 does NOT support the `paths` config schema, so the
        # config-file approach (.github/actionlint.yaml) is forward-compatible
        # documentation only; the runtime -ignore flag is the load-bearing
        # suppression mechanism on the current v1.7.1 pin.
        run: |
          "$RUNNER_TEMP/actionlint" -color -shellcheck "$SHELLCHECK_PATH" -ignore 'shellcheck reported issue in this script: SC2016:.+'

  # gate-efficacy: posture=required
  markdown-link-check:
    name: Markdown link integrity (markdown-link-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate local markdown links
        run: |
          # Deterministic, network-free check: every in-repo [text](path) markdown link
          # must resolve to a file that exists. External http(s) links are intentionally
          # NOT gated — itinerary/venue URLs are outside this repo's control and probing
          # them would make CI slow and flaky. Job name kept stable for branch protection.
          broken=""
          while IFS= read -r -d '' f; do
            dir="$(dirname "$f")"
            while IFS= read -r t; do
              case "$t" in http*|mailto:*|tel:*|'#'*|'') continue;; esac
              tt="${t%%#*}"; tt="${tt%%\?*}"; tt="${tt%% *}"
              if [ ! -e "$dir/$tt" ] && [ ! -e "$tt" ]; then
                broken="${broken}${f} -> ${t} | "
              fi
            done < <(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//')
          done < <(find . -type f -name "*.md" -not -path "./.git/*" -print0)
          if [ -n "$broken" ]; then
            echo "::error::broken local markdown link(s):"
            printf '%s\n' "$broken"
            exit 1
          fi
          echo "All local markdown links resolve."

  # gate-efficacy: posture=required
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    env:
      # The download pin: one upstream release of gitleaks, and the SHA-256 of its linux x64
      # tarball as that release's checksums file lists it. Move both together.
      GITLEAKS_VERSION: '8.21.2'
      GITLEAKS_SHA256: '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same subject matter as gitleaks — keeping sensitive data out of a public
      # repo — so it rides this job rather than adding a new check name (which
      # would need a branch-protection change). Runs BEFORE the gitleaks install
      # so a transient network failure there cannot mask a real trip-data exposure.
      # No ${{ }} interpolation: every input is a repo-static literal.
      - name: Trip-data ignore invariant (#254)
        run: |
          set -uo pipefail
          fail=0
          # Positive limb: ls-files, NOT check-ignore -v. Verbose exits 0 when ANY
          # pattern matches, including the !trips/README.md negation, which would
          # report a correctly-tracked signpost as ignored and invert this check.
          git ls-files --error-unmatch trips/README.md >/dev/null 2>&1 \
            || { echo "::error::trips/README.md is not tracked — the signpost is absent from a clone"; fail=1; }
          # Negative limb: check-ignore works on non-existent paths, so no synthetic
          # trip file is ever written to disk.
          git check-ignore -q "trips/zzz-probe-2026/travelers/probe.md" \
            || { echo "::error::trips/<trip>/travelers/<x>.md is NOT git-ignored — .gitignore stopped guarding trip data"; fail=1; }
          # Control arm: a zero whose control also returns zero is a broken probe.
          if git check-ignore -q README.md; then
            echo "::error::control arm broken — check-ignore reports the tracked root README.md as ignored; the check above is unusable"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Trip-data ignore invariant holds: signpost tracked, trip data ignored, control arm fires."

      # No fallback to an unverified download: a mismatch fails this step, nothing is
      # unpacked, and gitleaks below does not run.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$tarball" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/
          gitleaks version
      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --no-banner --redact --verbose
